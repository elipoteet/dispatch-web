<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Dispatch — Prototype v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#0E1D33; --cream:#F6F2E9; --gold:#B08430;
    --font:'Inter',system-ui,sans-serif; --mono:'IBM Plex Mono','SF Mono',monospace;
    --bg:var(--cream); --surface:#FFFDF7; --surface2:#EDE7DA;
    --border:rgba(14,29,51,.13); --border-strong:rgba(14,29,51,.28);
    --text:var(--navy); --dim:#5B6472; --accent:var(--gold);
    --green:#2F7D4F; --red:#A33A32;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0B1727; --surface:#101F35; --surface2:#16283F;
    --border:rgba(246,242,233,.12); --border-strong:rgba(246,242,233,.26);
    --text:#F0EBE0; --dim:#93A0B2; --accent:#D2A44E; --green:#63B583; --red:#D97A70;
  }}
  *{margin:0;padding:0;box-sizing:border-box;border-radius:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .mono{font-family:var(--mono)}

  /* ---------- TOP BAR ---------- */
  .topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border)}
  .topbar__in{max-width:1240px;margin:0 auto;height:56px;padding:0 20px;display:flex;align-items:center;gap:24px}
  .brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
  .brand span{font-family:var(--mono);font-size:12px;letter-spacing:2.6px;text-transform:uppercase}
  .searchbox{position:relative;flex:1;max-width:340px}
  .searchbox input{width:100%;background:var(--surface2);border:1px solid var(--border);padding:7px 11px 7px 30px;font-family:var(--mono);font-size:12px;color:var(--text);letter-spacing:.6px}
  .searchbox input:focus{outline:none;border-color:var(--accent)}
  .searchbox svg{position:absolute;left:9px;top:8px;opacity:.45}
  .searchdrop{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border-strong);border-top:none;z-index:60;max-height:280px;overflow:auto}
  .searchdrop div{padding:9px 12px;font-size:13px;display:flex;gap:10px;align-items:baseline;border-bottom:1px solid var(--border)}
  .searchdrop div:hover{background:var(--surface2)}
  .searchdrop b{font-family:var(--mono);font-size:12px;letter-spacing:1px;min-width:52px}
  .searchdrop em{font-style:normal;color:var(--dim);font-size:12px}
  .topbar__me{margin-left:auto;display:flex;align-items:center;gap:10px}

  /* ---------- LAYOUT ---------- */
  .shell{max-width:1220px;margin:0 auto;padding:0 20px;display:grid;grid-template-columns:236px minmax(0,1fr) 258px;gap:28px;align-items:start}
  .rail{position:sticky;top:0;padding:20px 0 26px;max-height:100dvh;overflow-y:auto;display:flex;flex-direction:column}
  .rail::-webkit-scrollbar{width:0}
  .rail--r{padding-top:22px;display:block}


  /* ---------- NAV ---------- */
  .nav{display:flex;flex-direction:column;gap:1px}
  .nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;text-align:left;color:var(--dim);font-size:14px;width:100%;border-left:2px solid transparent}
  .nav button:hover{background:var(--surface2);color:var(--text)}
  .nav button.active{color:var(--text);border-left-color:var(--accent);background:var(--surface2);font-weight:500}
  .nav svg{flex-shrink:0;opacity:.75}
  .nav .badge{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--accent)}

  .me{border:1px solid var(--border);background:var(--surface);padding:14px;margin-top:22px}
  .me__name{font-weight:500;font-size:14px}
  .me__stat{font-family:var(--mono);font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);margin-top:8px}

  /* ---------- MAIN ---------- */
  .main{border-left:1px solid var(--border);border-right:1px solid var(--border);min-height:100vh;background:var(--surface)}
  .viewhead{padding:16px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:20}
  .viewhead h1{font-size:19px;font-weight:500;letter-spacing:-.4px}
  .viewhead p{font-size:12.5px;color:var(--dim);margin-top:3px}
  .tabs{display:flex;gap:0;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:19}
  .tabs button{padding:12px 20px;font-size:13px;color:var(--dim);border-bottom:2px solid transparent;font-family:var(--mono);letter-spacing:1.2px;text-transform:uppercase;font-size:11px}
  .tabs button.active{color:var(--text);border-bottom-color:var(--accent)}
  .tabs button:hover{background:var(--surface2)}

  /* ---------- COMPOSER ---------- */
  .composer{padding:18px 22px;border-bottom:8px solid var(--bg);display:flex;gap:12px}
  .composer textarea{flex:1;background:transparent;border:none;resize:none;font-family:var(--font);font-size:16px;color:var(--text);min-height:52px;line-height:1.45}
  .composer textarea:focus{outline:none}
  .composer textarea::placeholder{color:var(--dim)}
  .composer__foot{display:flex;align-items:center;gap:8px;margin-top:8px}
  .chipbtn{font-family:var(--mono);font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);border:1px solid var(--border);padding:5px 9px}
  .chipbtn:hover{border-color:var(--accent);color:var(--accent)}
  .postbtn{margin-left:auto;background:var(--navy);color:var(--cream);font-family:var(--mono);font-size:11px;letter-spacing:1.4px;text-transform:uppercase;padding:8px 18px}
  @media (prefers-color-scheme:dark){.postbtn{background:var(--accent);color:#0B1727}}
  .postbtn:disabled{opacity:.35;cursor:default}

  /* ---------- PINNED ---------- */
  .pinned{margin:0;padding:16px 22px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;gap:14px;align-items:center;cursor:pointer}
  .pinned:hover{background:var(--border)}
  .pinned__k{font-family:var(--mono);font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent)}
  .pinned h3{font-size:16px;font-weight:500;margin-top:4px;letter-spacing:-.3px}
  .pinned p{font-size:12.5px;color:var(--dim);margin-top:3px}
  .pinned__n{margin-left:auto;text-align:right;font-family:var(--mono);font-size:11px;color:var(--dim);flex-shrink:0}
  .pinned__n b{display:block;font-size:21px;font-weight:400;color:var(--text)}

  /* ---------- POST ---------- */
  .post{padding:17px 22px;border-bottom:1px solid var(--border);display:flex;gap:12px}
  .post:hover{background:var(--surface2)}
  .av{width:38px;height:38px;flex-shrink:0;background:var(--navy);color:var(--cream);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.5px}
  @media (prefers-color-scheme:dark){.av{background:var(--surface2);color:var(--text);border:1px solid var(--border-strong)}}
  .av--gold{background:var(--gold);color:#fff}
  .post__b{flex:1;min-width:0}
  .post__hd{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-bottom:5px}
  .post__hd .nm{font-weight:500;font-size:14.5px}
  .edu{font-family:var(--mono);font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);padding:1.5px 5px;white-space:nowrap}
  .edu--alum{color:var(--dim);border-color:var(--border-strong)}
  .edu__tick{margin-right:3px}
  .beat{font-family:var(--mono);font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim)}
  .post__t{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim);flex-shrink:0}
  .post__x{font-size:15px;line-height:1.55;overflow-wrap:break-word}
  .cash{color:var(--accent);font-family:var(--mono);font-size:13.5px;font-weight:500;letter-spacing:.3px;border-bottom:1px solid transparent}
  .cash:hover{border-bottom-color:var(--accent)}
  .theme{color:var(--dim);font-weight:500}
  .theme:hover{color:var(--text);text-decoration:underline}

  /* data chip attached to a post */
  .chip{margin-top:12px;border:1px solid var(--border);background:var(--bg);display:flex;align-items:stretch;cursor:pointer}
  .chip:hover{border-color:var(--accent)}
  .chip__l{padding:12px 14px;flex:1;min-width:0}
  .chip__sym{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:1.2px}
  .chip__nm{font-size:12px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip__px{font-family:var(--mono);font-size:17px;margin-top:8px;font-variant-numeric:tabular-nums}
  .chip__d{font-family:var(--mono);font-size:11.5px;margin-top:2px}
  .chip__r{width:132px;flex-shrink:0;display:flex;align-items:center;padding:10px;border-left:1px solid var(--border)}
  .chip__stamp{font-family:var(--mono);font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);padding:6px 14px;border-top:1px solid var(--border)}
  .up{color:var(--green)} .down{color:var(--red)}

  .tags{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
  .tag{font-family:var(--mono);font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim);border:1px solid var(--border);padding:3px 7px}
  .tag:hover{border-color:var(--accent);color:var(--accent)}

  .acts{display:flex;gap:26px;margin-top:12px}
  .acts button{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .acts button:hover{color:var(--accent)}
  .acts button.on{color:var(--accent)}
  .acts svg{opacity:.7}

  /* ---------- RIGHT RAIL ---------- */
  .card{border:1px solid var(--border);background:var(--surface);margin-bottom:18px}
  .card__h{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
  .card__h h3{font-family:var(--mono);font-size:10px;letter-spacing:1.7px;text-transform:uppercase;color:var(--dim);font-weight:600}
  .card__h .more{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.8px}
  .wrow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);cursor:pointer}
  .wrow:last-child{border-bottom:none}
  .wrow:hover{background:var(--surface2)}
  .wrow__s{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:1px;width:52px;flex-shrink:0}
  .wrow__p{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;margin-left:auto}
  .wrow__d{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;width:60px;text-align:right;flex-shrink:0}
  .trow{display:flex;align-items:baseline;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);cursor:pointer}
  .trow:last-child{border-bottom:none}
  .trow:hover{background:var(--surface2)}
  .trow__n{font-family:var(--mono);font-size:10px;color:var(--accent);width:16px;flex-shrink:0}
  .trow__t{font-size:13px;font-weight:500}
  .trow__c{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim);flex-shrink:0}
  .rail__note{font-family:var(--mono);font-size:10px;line-height:1.7;color:var(--dim);letter-spacing:.5px;padding:0 2px}

  /* ---------- TICKER PAGE ---------- */
  .tk{padding:22px}
  .tk__top{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap}
  .tk__sym{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:2px;line-height:1}
  .tk__nm{font-size:14px;color:var(--dim);margin-top:6px}
  .tk__px{margin-left:auto;text-align:right}
  .tk__px b{font-family:var(--mono);font-size:34px;font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:-1px;display:block;line-height:1}
  .tk__px span{font-family:var(--mono);font-size:13px;display:block;margin-top:6px}
  .tk__acts{display:flex;gap:8px;margin-top:18px}
  .btn{font-family:var(--mono);font-size:11px;letter-spacing:1.3px;text-transform:uppercase;padding:9px 16px;border:1px solid var(--border-strong);color:var(--text)}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn--on{background:var(--navy);color:var(--cream);border-color:var(--navy)}
  @media (prefers-color-scheme:dark){.btn--on{background:var(--accent);color:#0B1727;border-color:var(--accent)}}
  .chartbox{margin-top:20px;border:1px solid var(--border);background:var(--bg);padding:16px}
  .grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);margin-top:20px}
  .stat{background:var(--surface);padding:13px 14px;min-width:0}
  .stat__k{font-family:var(--mono);font-size:9.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim)}
  .stat__v{font-family:var(--mono);font-size:17px;margin-top:6px;font-variant-numeric:tabular-nums}
  .secthead{padding:14px 22px;border-top:8px solid var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .secthead h2{font-family:var(--mono);font-size:10.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--dim);font-weight:600}
  .secthead .c{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--dim)}

  /* ---------- RESEARCH TAB ---------- */
  .rsearch{padding:22px}
  .rsearch__in{position:relative}
  .rsearch input{width:100%;background:var(--bg);border:1px solid var(--border-strong);padding:15px 15px 15px 44px;font-family:var(--mono);font-size:15px;letter-spacing:1.4px;color:var(--text);text-transform:uppercase}
  .rsearch input:focus{outline:none;border-color:var(--accent)}
  .rsearch svg{position:absolute;left:15px;top:16px;opacity:.5}
  .rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);margin-top:20px}
  .rcell{background:var(--surface);padding:14px;cursor:pointer;min-width:0}
  .rcell:hover{background:var(--surface2)}
  .rcell__s{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:1.2px}
  .rcell__n{font-size:11.5px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rcell__p{font-family:var(--mono);font-size:13px;margin-top:10px;font-variant-numeric:tabular-nums}
  .rcell__d{font-family:var(--mono);font-size:11px;margin-top:2px}

  /* ---------- WATCHLISTS ---------- */
  .wl{padding:22px}
  .wl__hd{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .wl__hd .av{width:34px;height:34px}
  .bigrow{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--border);cursor:pointer}
  .bigrow:hover{padding-left:6px;transition:padding .12s}
  .bigrow__s{font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:1.3px;width:66px;flex-shrink:0}
  .bigrow__n{font-size:13.5px;color:var(--dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bigrow__adds{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-left:auto;flex-shrink:0;text-align:right}
  .bigrow__p{font-family:var(--mono);font-size:14px;width:82px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}

  .empty{padding:50px 22px;text-align:center;color:var(--dim);font-family:var(--mono);font-size:12px;letter-spacing:1px}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:var(--cream);font-family:var(--mono);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;padding:11px 20px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
  @media (prefers-color-scheme:dark){.toast{background:var(--accent);color:#0B1727}}
  .toast.show{opacity:1;transform:translateX(-50%)}

  .protonote{max-width:1240px;margin:0 auto;padding:14px 20px 40px;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);text-align:center}



  /* ============ SUBSTANCE PASS ============ */
  .typills{display:flex;gap:7px;margin-bottom:13px;flex-wrap:wrap}
  .typill{font-family:var(--mono);font-size:10px;letter-spacing:1.3px;text-transform:uppercase;padding:6px 13px;border:1px solid var(--border);border-radius:var(--pill);color:var(--dim);transition:.14s}
  .typill:hover{border-color:var(--accent);color:var(--accent)}
  .typill.on{background:var(--navy);color:var(--cream);border-color:var(--navy)}
  @media (prefers-color-scheme:dark){.typill.on{background:var(--accent);color:#0B1727;border-color:var(--accent)}}

  .draftcard{margin-top:13px;border:1px solid var(--accent);border-radius:var(--r);overflow:hidden;background:var(--bg)}
  .draftcard__h{display:flex;align-items:center;gap:9px;padding:9px 14px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent)}
  .draftcard__b{display:flex;align-items:center;gap:16px;padding:13px 14px;flex-wrap:wrap}
  .draftcard__sym{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:1.3px}
  .draftcard__px{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
  .dstat{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.5px}
  .dstat b{color:var(--text);font-weight:500}

  .cmindfield{margin-top:13px;border-top:1px dashed var(--border-strong);padding-top:13px}
  .cmindfield label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
  .cmindfield input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);padding:7px 0;font-family:var(--font);font-size:14.5px;color:var(--text)}
  .cmindfield input:focus{outline:none;border-bottom-color:var(--accent)}
  .cmindfield input::placeholder{color:var(--dim)}

  .hint{font-family:var(--mono);font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--dim)}

  .ty{font-family:var(--mono);font-size:9px;letter-spacing:1.4px;text-transform:uppercase;padding:2.5px 8px;border-radius:var(--pill);background:var(--surface2);color:var(--dim);font-weight:600}
  .ty--question{background:rgba(176,132,48,.16);color:var(--accent)}
  .ty--thesis{background:var(--navy);color:var(--cream)}
  @media (prefers-color-scheme:dark){.ty--thesis{background:var(--accent);color:#0B1727}}

  .deskmark{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .deskmark::after{content:'';flex:1;height:1px;background:var(--border)}

  .cmind{margin-top:13px;border-left:2px solid var(--accent);padding:11px 0 11px 14px}
  .cmind__k{font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:5px}
  .cmind p{font-size:14.5px;line-height:1.5;color:var(--dim)}

  .reply{margin-top:16px;padding:14px 0 0 16px;border-left:1px solid var(--border);display:flex;gap:11px}
  .reply .av{width:32px;height:32px;font-size:10.5px}
  .reply__x{font-size:14.5px;line-height:1.55;margin-top:4px}
  .pbtag{font-family:var(--mono);font-size:9px;letter-spacing:1.4px;text-transform:uppercase;padding:2.5px 8px;border-radius:var(--pill);background:rgba(163,58,50,.13);color:var(--red);font-weight:600}
  @media (prefers-color-scheme:dark){.pbtag{background:rgba(217,122,112,.16)}}

  .deskrow{display:flex;gap:11px;padding:11px 16px;border-bottom:1px solid var(--border);cursor:pointer;align-items:flex-start}
  .deskrow:last-child{border-bottom:none}
  .deskrow:hover{background:var(--surface2)}
  .deskrow__n{font-family:var(--mono);font-size:10px;color:var(--accent);flex-shrink:0;margin-top:2px}
  .deskrow__t{font-size:12.5px;line-height:1.4}
  .deskrow__w{font-family:var(--mono);font-size:10px;color:var(--dim);display:block;margin-top:3px}

  /* ============ RAIL CHROME ============ */
  .brand--rail{display:flex;align-items:center;gap:10px;padding:0 14px 18px;color:var(--text)}
  .brand--rail span{font-family:var(--mono);font-size:13px;letter-spacing:3px;text-transform:uppercase}
  .searchbox--rail{max-width:none;margin:0 0 20px}
  .searchbox--rail input{width:100%;padding:9px 12px 9px 32px;font-size:11px}
  .searchbox--rail svg{top:10px;left:11px}
  .rail .me{margin-top:auto}
  .rail__spacer{flex:1;min-height:18px}

  /* ============ PROOF OF LIFE RAIL ============ */
  .alive{padding:16px}
  .alive__n{font-size:26px;font-weight:300;letter-spacing:-1px;line-height:1.15}
  .alive__n b{font-weight:400}
  .alive__sub{font-family:var(--mono);font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);margin-top:7px}
  .alive__stack{display:flex;align-items:center;margin-top:14px}
  .alive__stack .av{width:28px;height:28px;font-size:9.5px;margin-left:-8px;border:2px solid var(--surface)}
  .alive__stack .av:first-child{margin-left:0}
  .newrow{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--border);cursor:pointer}
  .newrow:hover{background:var(--surface2)}
  .newrow .av{width:26px;height:26px;font-size:9px;flex-shrink:0}
  .newrow__n{font-size:12.5px;font-weight:500;line-height:1.3;min-width:0}
  .newrow__s{font-family:var(--mono);font-size:9px;letter-spacing:.9px;color:var(--dim);display:block;margin-top:2px}
  .sprow{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);cursor:pointer}
  .sprow:last-child{border-bottom:none}
  .sprow:hover{background:var(--surface2)}
  .sprow__n{font-size:12.5px;line-height:1.3;min-width:0;flex:1}
  .sprow__new{font-family:var(--mono);font-size:9.5px;letter-spacing:1px;color:var(--accent);flex-shrink:0}

  /* ============ PROMOTE MODAL ============ */
  .scrim{position:fixed;inset:0;background:rgba(14,29,51,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(2px)}
  .modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r);max-width:560px;width:100%;max-height:88vh;overflow:auto}
  .modal__h{padding:20px 24px;border-bottom:1px solid var(--border)}
  .modal__k{font-family:var(--mono);font-size:9.5px;letter-spacing:1.7px;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .modal__h h2{font-size:19px;font-weight:500;letter-spacing:-.4px}
  .modal__h p{font-size:13px;color:var(--dim);margin-top:7px;line-height:1.55}
  .modal__b{padding:20px 24px}
  .modal__f{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;justify-content:flex-end}
  .modal__sec{margin-bottom:20px}
  .modal__sec>label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
  .quoted{border-left:2px solid var(--border-strong);padding:2px 0 2px 14px;font-size:14px;line-height:1.55;color:var(--dim)}
  .modal__cm{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:11px 12px;font-family:var(--font);font-size:14px;color:var(--text)}
  .modal__cm:focus{outline:none;border-color:var(--accent)}
  .poschoice{display:flex;gap:8px}
  .poschoice button{flex:1;font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;border:1px solid var(--border);border-radius:var(--pill);padding:10px}
  .poschoice button.on{background:var(--navy);color:var(--cream);border-color:var(--navy)}
  @media (prefers-color-scheme:dark){.poschoice button.on{background:var(--accent);color:#0B1727;border-color:var(--accent)}}
  .modal__note{font-size:12.5px;color:var(--dim);line-height:1.6;background:var(--surface2);border-radius:var(--rs);padding:12px 14px}

  /* ============ SPACES ============ */
  .nav__sec{font-family:var(--mono);font-size:9px;letter-spacing:1.8px;text-transform:uppercase;color:var(--dim);margin:22px 0 8px 15px}
  .nav__sp{display:flex;align-items:center;gap:10px;padding:9px 15px;text-align:left;width:100%;color:var(--dim);font-size:13.5px;border-radius:var(--pill)}
  .nav__sp:hover{background:var(--surface2);color:var(--text)}
  .nav__sp.active{background:rgba(176,132,48,.13);color:var(--accent);font-weight:500}
  .nav__dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .nav__new-ct{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.8px;color:var(--accent);flex-shrink:0}
  .nav__new{font-family:var(--mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);padding:9px 15px;display:block;text-align:left;width:100%}
  .nav__new:hover{color:var(--accent)}

  .sphead{padding:24px;border-bottom:1px solid var(--border);background:var(--surface2)}
  .sphead__top{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .sphead h1{font-size:22px;font-weight:500;letter-spacing:-.5px;line-height:1.15}
  .sphead__desc{font-size:13.5px;color:var(--dim);margin-top:7px;line-height:1.5;max-width:56ch}
  .sphead__meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .lockchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);border:1px solid var(--border-strong);border-radius:var(--pill);padding:4px 10px}
  .memchip{font-family:var(--mono);font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim)}
  .ownerchip{font-family:var(--mono);font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:var(--pill);padding:4px 10px}

  .invite{margin-top:18px;border:1px dashed var(--border-strong);border-radius:var(--r);padding:13px 15px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bg)}
  .invite__k{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);width:100%}
  .invite__url{font-family:var(--mono);font-size:13px;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .invite__hint{width:100%;font-size:12px;color:var(--dim);line-height:1.5}

  .avstack{display:flex;align-items:center}
  .avstack .av{width:26px;height:26px;font-size:9px;margin-left:-7px;border:2px solid var(--surface2)}
  .avstack .av:first-child{margin-left:0}

  .pubmark{display:flex;align-items:center;gap:8px;margin-top:13px;padding-top:11px;border-top:1px solid var(--border);font-family:var(--mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent)}
  .pubbtn{font-family:var(--mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);border:1px solid var(--border);border-radius:var(--pill);padding:5px 11px;margin-top:13px}
  .pubbtn:hover{border-color:var(--accent);color:var(--accent)}

  /* ============ SIGNUP ============ */
  .su{max-width:470px;margin:0 auto;padding:44px 24px 60px}
  .su__steps{display:flex;gap:6px;margin-bottom:30px}
  .su__step{flex:1;height:2px;background:var(--border)}
  .su__step.on{background:var(--accent)}
  .su h2{font-size:24px;font-weight:500;letter-spacing:-.6px;line-height:1.2}
  .su__sub{font-size:14px;color:var(--dim);margin-top:9px;line-height:1.55}
  .su__f{margin-top:26px}
  .su__f label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
  .su__f input,.su__f select{width:100%;background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--rs);padding:13px 14px;font-family:var(--font);font-size:15px;color:var(--text)}
  .su__f input:focus,.su__f select:focus{outline:none;border-color:var(--accent)}
  .su__f input.mono{font-family:var(--mono);letter-spacing:3px;text-align:center;font-size:19px}
  .su__go{width:100%;margin-top:22px;background:var(--navy);color:var(--cream);font-family:var(--mono);font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;padding:14px;border-radius:var(--pill)}
  @media (prefers-color-scheme:dark){.su__go{background:var(--accent);color:#0B1727}}
  .su__go:disabled{opacity:.35;cursor:default}
  .su__alt{margin-top:24px;padding-top:22px;border-top:1px solid var(--border);text-align:center}
  .su__alt p{font-size:13px;color:var(--dim);margin-bottom:13px}
  .su__li{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--border-strong);border-radius:var(--pill);padding:11px 20px;font-size:14px}
  .su__li:hover{border-color:var(--accent);color:var(--accent)}
  .su__back{font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin-top:20px;display:inline-block}
  .su__back:hover{color:var(--accent)}
  .su__note{font-size:12.5px;color:var(--dim);line-height:1.6;margin-top:18px;padding:13px 15px;background:var(--surface2);border-radius:var(--rs)}
  .su__done{text-align:center;padding:10px 0 0}
  .su__badgebox{border:1px solid var(--border);border-radius:var(--r);padding:26px 20px;margin-top:24px;background:var(--bg)}
  .su__cmp{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-top:26px}
  .su__cmpcell{background:var(--bg);padding:18px 15px;text-align:center}
  .su__cmpcell h4{font-family:var(--mono);font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);margin-bottom:12px}
  .su__cmpcell p{font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:11px}

  /* ============ PROFILE ============ */
  a.nm{border-bottom:1px solid transparent}
  a.nm:hover{border-bottom-color:var(--accent)}
  .pro{padding:26px 24px 22px;border-bottom:1px solid var(--border)}
  .pro__top{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
  .pro .av{width:66px;height:66px;font-size:20px}
  .pro__id{min-width:0;flex:1}
  .pro__nm{font-size:25px;font-weight:500;letter-spacing:-.6px;line-height:1.1}
  .pro__meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:9px}
  .pro__handle{font-family:var(--mono);font-size:11.5px;letter-spacing:.9px;color:var(--dim);margin-top:8px}
  .pro__url{font-family:var(--mono);font-size:10.5px;letter-spacing:.9px;color:var(--dim);border:1px dashed var(--border-strong);border-radius:var(--pill);padding:5px 12px;display:inline-block;margin-top:14px}
  .pro__now{font-size:14px;color:var(--text);margin-top:12px}
  .pro__now span{font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:3px}
  .pro__li{display:inline-flex;align-items:center;gap:7px;margin-top:12px;font-size:13.5px;color:var(--accent);border:1px solid var(--border);border-radius:var(--pill);padding:7px 14px}
  .pro__li:hover{border-color:var(--accent)}
  .pro__self{font-family:var(--mono);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin-left:9px;align-self:center}
  .wl2{padding:4px 0}
  .wl2__row{display:flex;gap:16px;padding:14px 24px;border-bottom:1px solid var(--border);cursor:pointer;align-items:baseline}
  .wl2__row:last-child{border-bottom:none}
  .wl2__row:hover{background:var(--surface2)}
  .wl2__s{font-family:var(--mono);font-size:13.5px;font-weight:600;letter-spacing:1.2px;width:62px;flex-shrink:0}
  .wl2__why{font-size:14px;line-height:1.5;color:var(--dim);min-width:0}

  /* ============ THESIS TESTED ============ */
  .trig{margin:0;padding:17px 24px;border-bottom:1px solid var(--border);background:var(--bg);border-left:3px solid var(--accent);cursor:pointer}
  .trig:hover{background:var(--surface2)}
  .trig__k{font-family:var(--mono);font-size:9.5px;letter-spacing:1.7px;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .trig p{font-size:15px;line-height:1.55}
  .trig p b{font-weight:500}
  .trig__go{font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent);margin-top:10px;display:inline-block}
  .watchrow{padding:11px 16px;border-bottom:1px solid var(--border);cursor:pointer}
  .watchrow:last-child{border-bottom:none}
  .watchrow:hover{background:var(--surface2)}
  .watchrow__w{font-size:12.5px;line-height:1.45;color:var(--dim)}
  .watchrow__w b{color:var(--text);font-weight:500}
  .watchrow__m{font-family:var(--mono);font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--accent);margin-top:5px}

  /* ============ ORIENTATION ============ */
  .orient{padding:15px 24px;border-bottom:1px solid var(--border);background:var(--surface2);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
  .orient b{font-size:14.5px;font-weight:500;letter-spacing:-.2px}
  .orient span{font-size:13px;color:var(--dim);line-height:1.5}
  .pinned p em{font-style:normal;color:var(--text);font-weight:500}

  /* ============ FIXES ============ */
  .grid4{grid-template-columns:repeat(3,minmax(0,1fr))}
  @media (max-width:620px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .composer textarea{width:100%;display:block}
  .wrow__s{width:auto;min-width:54px;display:flex;align-items:center;gap:5px;white-space:nowrap}
  .wrow__p{margin-left:auto}

  /* ============ TOGGLE ============ */
  .tgl{display:inline-block;width:32px;height:18px;background:var(--border-strong);border-radius:999px;position:relative;cursor:pointer;transition:background .16s;flex-shrink:0;vertical-align:middle}
  .tgl.on{background:var(--accent)}
  .tgl i{position:absolute;top:2px;left:2px;width:14px;height:14px;background:var(--surface);border-radius:50%;transition:transform .16s}
  .tgl.on i{transform:translateX(14px)}
  .tglwrap{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim)}

  /* ============ LOOSER PASS ============ */
  :root{ --r:10px; --rs:7px; --pill:999px; }
  .av{border-radius:50%;width:42px;height:42px;font-size:13px}
  .me .av,.wl__hd .av{border-radius:50%}
  .topbar__me .av{width:34px;height:34px;font-size:11px}
  .edu{border-radius:var(--pill);border:none;background:rgba(176,132,48,.14);padding:3px 9px;font-weight:500}
  .edu--alum{background:var(--surface2);color:var(--dim)}
  @media (prefers-color-scheme:dark){.edu{background:rgba(210,164,78,.16)}}
  .tag,.chipbtn,.btn,.postbtn{border-radius:var(--pill)}
  .btn{padding:10px 18px}
  .postbtn{padding:9px 22px}
  .card,.chip,.grid4,.rgrid,.searchdrop{border-radius:var(--r);overflow:hidden}
  .chip__stamp{border-radius:0}
  .searchbox input,.rsearch input{border-radius:var(--pill)}
  .rsearch input{padding-left:48px}
  .chartbox{border-radius:var(--r)}
  .nav button{border-radius:var(--pill);border-left:none;padding:11px 15px}
  .nav button.active{background:rgba(176,132,48,.13);color:var(--accent)}
  @media (prefers-color-scheme:dark){.nav button.active{background:rgba(210,164,78,.14)}}
  .me{border-radius:var(--r);padding:16px}
  .main{border-radius:var(--r);border:1px solid var(--border);overflow:visible;margin-top:20px}
  .viewhead{border-radius:var(--r) var(--r) 0 0;top:0}
  .tabs{border-radius:var(--r) var(--r) 0 0;overflow:hidden}
  .post{padding:20px 24px;transition:background .14s}
  .post:hover{background:var(--surface2)}
  .post__x{font-size:15.5px;line-height:1.6}
  .composer{padding:22px 24px}
  .pinned{border-radius:0;padding:18px 24px}
  .acts{margin-top:14px;gap:30px}
  .acts button{padding:5px 10px;border-radius:var(--pill);margin-left:-10px;transition:background .14s}
  .acts button:hover{background:rgba(176,132,48,.12)}
  .wrow,.trow{border-radius:0;padding:11px 16px}
  .card__h{padding:13px 16px}
  .bigrow{padding:15px 0}
  .stat{padding:15px 16px}
  .rcell{padding:16px}
  .toast{border-radius:var(--pill)}
  .viewhead{padding:20px 24px}
  .secthead{padding:16px 24px}
  .tk,.wl,.rsearch{padding:24px}

  @media (max-width:1080px){.shell{grid-template-columns:236px minmax(0,1fr)}.rail--r{display:none}}
  @media (max-width:760px){
    .shell{grid-template-columns:1fr;padding:0}
    .rail{display:none}
    .main{border:none}
    .viewhead,.tabs{top:0}
    .mobnav{display:flex !important}
    body{padding-bottom:56px}
  }
  .mobnav{display:none;position:fixed;bottom:0;left:0;right:0;height:56px;background:var(--surface);border-top:1px solid var(--border);z-index:60}
  .mobnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--mono);font-size:8.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
  .mobnav button.active{color:var(--accent)}
</style>
</head>
<body>

<div class="shell">
  <!-- LEFT RAIL -->
  <aside class="rail">
    <a class="brand brand--rail" href="#" onclick="go('feed');return false">
      <svg width="26" height="26" viewBox="0 0 30 30" fill="none" aria-hidden="true">
        <path d="M4 3h9a12 12 0 0 1 0 24H4V3z" stroke="currentColor" stroke-width="2.6" fill="none"/>
        <path d="M7 22L25 6" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M18 6h7v7" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Dispatch</span>
    </a>

    <div class="searchbox searchbox--rail">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="gsearch" placeholder="SEARCH TICKERS" autocomplete="off">
      <div class="searchdrop" id="gdrop" style="display:none"></div>
    </div>

    <nav class="nav" id="nav">
      <button data-v="feed" class="active">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M2 3h12M2 8h12M2 13h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Feed</button>
      <button data-v="research">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Research</button>
    </nav>
    <div class="nav__sec">Spaces</div>
    <nav class="nav" id="navspaces">
      <button class="nav__sp" data-sp="unh-investment-club" onclick="go('space','unh-investment-club')">
        <span class="nav__dot" style="background:#003591"></span>UNH Investment Club<span class="nav__new-ct">4</span></button>
      <button class="nav__sp" data-sp="pitch-team-fall" onclick="go('space','pitch-team-fall')">
        <span class="nav__dot" style="background:#B08430"></span>Pitch Team, Fall<span class="nav__new-ct">1</span></button>
      <button class="nav__new" onclick="toast('Creates a space and gives you an invite link to share')">+ New space</button>
    </nav>
    <div class="rail__spacer"></div>
    <nav class="nav">
      <button data-v="signup">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5.5" r="2.8" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 14a5.5 5.5 0 0111 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Sign-up<span class="badge">DEMO</span></button>
    </nav>
    <div class="me" style="cursor:pointer" onclick="go('profile','elipoteet')">
      <div style="display:flex;gap:9px;align-items:center">
        <div class="av av--gold" style="width:32px;height:32px;font-size:11px">EP</div>
        <div style="min-width:0">
          <div class="me__name">Eli Poteet</div>
          <div class="mono" style="font-size:10.5px;color:var(--dim);letter-spacing:.8px">@elipoteet</div>
        </div>
      </div>
      <div style="margin-top:12px"><span class="edu"><span class="edu__tick">✓</span>UNH '27</span></div>
      <div class="me__stat" style="margin-top:9px">Covers Energy</div>
      
    </div>
    <div class="rail__note" style="margin-top:20px">Prototype.<br>Data is illustrative.</div>
  </aside>

function dtxt(d){return (d>=0?'+':'')+d.toFixed(2)+'%';}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function linkify(s){
  return esc(s)
    .replace(/\$([A-Z]{1,5})\b/g, function(m,sym){
      return T[sym] ? '<a class="cash" href="#" onclick="go(\'ticker\',\''+sym+'\');return false">$'+sym+'</a>' : m;
    })
    .replace(/#([a-z]+)\b/g, '<a class="theme" href="#" onclick="go(\'theme\',\'$1\');return false">#$1</a>');
}

function spark(sym,w,h,strokeW){
  var seed=0; for(var i=0;i<sym.length;i++) seed+=sym.charCodeAt(i);
  var pts=[], v=50;
  for(var j=0;j<40;j++){ seed=(seed*9301+49297)%233280; v+= (seed/233280-0.46)*9; v=Math.max(8,Math.min(92,v)); pts.push(v); }
  var up = T[sym] ? T[sym].d>=0 : true;
  var d = pts.map(function(p,i){ return (i?'L':'M')+(i/(pts.length-1)*w).toFixed(1)+' '+(h-(p/100*h)).toFixed(1); }).join(' ');
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="display:block;width:100%"><path d="'+d+'" fill="none" stroke="var(--'+(up?'green':'red')+')" stroke-width="'+(strokeW||1.5)+'" stroke-linejoin="round"/></svg>';
}

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(function(){t.classList.remove('show')},1700);}

function wIdx(s){for(var i=0;i<WATCH.length;i++){if(WATCH[i].s===s)return i;}return -1;}
function inWatch(s){return wIdx(s)>-1;}
function isPub(s){var i=wIdx(s);return i>-1&&WATCH[i].pub;}
function pubList(){return WATCH.filter(function(w){return w.pub})}
function toggleWatch(s){
  var i=wIdx(s);
  if(i>-1){WATCH.splice(i,1);toast('Removed '+s);}
  else{WATCH.push({s:s,pub:true});toast('Added '+s+' · public');}
  render();
}
function togglePriv(s,ev){
  if(ev)ev.stopPropagation();

  WATCH[i].pub=!WATCH[i].pub;

}

      '<div class="rsearch__in">'+
        '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'+
        '<input id="rsearchin" placeholder="TICKER OR COMPANY" autocomplete="off" oninput="filterGrid(this.value)">'+
      '</div>'+
      '<div class="rgrid" id="rgrid">'+syms.map(cellHTML).join('')+'</div>'+
    '</div>';
}
function cellHTML(s){
  var d=T[s];
  return '<div class="rcell" data-s="'+s+'" data-n="'+d.n.toUpperCase()+'" onclick="go(\'ticker\',\''+s+'\')">'+
    '<div class="rcell__s">'+s+'</div><div class="rcell__n">'+d.n+'</div>'+
    '<div class="rcell__p">'+fmt(d.p)+'</div><div class="rcell__d '+dcls(d.d)+'">'+dtxt(d.d)+'</div></div>';
}
function filterGrid(q){
  q=(q||'').toUpperCase().trim();
  [].forEach.call(document.querySelectorAll('#rgrid .rcell'),function(c){
    var hit = !q || c.dataset.s.indexOf(q)>-1 || c.dataset.n.indexOf(q)>-1;
    c.style.display = hit?'':'none';
  });
}

function vWatchlists(){
  var mine = WATCH.map(function(o){var s=o.s,d=T[s];
    return '<div class="bigrow" onclick="go(\'ticker\',\''+s+'\')">'+
      '<span class="bigrow__s">'+s+'</span><span class="bigrow__n">'+d.n+'</span>'+
      '<span class="bigrow__adds" style="display:flex;align-items:center;gap:9px">'+switchHTML(s)+
      '<span style="width:52px;text-align:left">'+(o.pub?'Public':'Private')+'</span></span>'+
      '<span class="bigrow__p '+dcls(d.d)+'">'+fmt(d.p)+'</span></div>'}).join('');
  var others = PEOPLE_LISTS.map(function(p){
    return '<div class="card" style="margin-bottom:0;border:none;border-top:1px solid var(--border)">'+
      '<div style="padding:16px 22px 4px"><div class="wl__hd" style="margin-bottom:10px">'+
        '<div class="av">'+p.av+'</div>'+
        '<div><div style="font-weight:500;font-size:14px">'+p.nm+'</div>'+
        '<div style="margin-top:3px"><span class="edu"><span class="edu__tick">✓</span>'+p.sc+'</span></div></div>'+
        '<button class="btn" style="margin-left:auto" onclick="toast(\'Following '+p.h+'\\\'s list\')">Follow list</button>'+
      '</div>'+
      p.list.map(function(s){var d=T[s];
        return '<div class="bigrow" onclick="go(\'ticker\',\''+s+'\')"><span class="bigrow__s">'+s+'</span>'+
        '<span class="bigrow__n">'+d.n+'</span><span class="bigrow__p '+dcls(d.d)+'">'+dtxt(d.d)+'</span></div>'}).join('')+
      '</div></div>'}).join('');
  var agg = TRENDING.map(function(x){var d=T[x.s];
    return '<div class="bigrow" onclick="go(\'ticker\',\''+x.s+'\')"><span class="bigrow__s">'+x.s+'</span>'+
    '<span class="bigrow__n">'+d.n+'</span><span class="bigrow__adds">'+x.adds+' adds this week</span>'+
    '<span class="bigrow__p '+dcls(d.d)+'">'+fmt(d.p)+'</span></div>'}).join('');

  return '<div class="viewhead"><h1>Watchlists</h1><p>Public by default, private when you want it. Private names stay out of the network numbers too.</p></div>'+
    '<div class="wl"><div class="wl__hd"><div class="av av--gold">EP</div>'+
      '<div><div style="font-weight:500">Your list</div><div class="mono" style="font-size:10.5px;color:var(--dim);letter-spacing:1px;text-transform:uppercase">'+pubList().length+' public · '+(WATCH.length-pubList().length)+' private</div></div></div>'+
      mine+'</div>'+
    '<div class="secthead"><h2>What the network is adding</h2><span class="c">this week</span></div>'+
    '<div class="wl" style="padding-top:6px">'+agg+'</div>'+
    '<div class="secthead"><h2>Lists worth following</h2></div>'+others;
}

function vThemes(){
  return '<div class="viewhead"><h1>Themes</h1><p>Markets do not move one ticker at a time. Follow the thing, not just the symbol.</p></div>'+
    '<div class="wl">'+THEMES.map(function(x){
      return '<div class="bigrow" onclick="go(\'theme\',\''+x.t+'\')">'+
        '<span class="bigrow__s" style="width:auto;min-width:110px;color:var(--accent)">#'+x.t+'</span>'+
        '<span class="bigrow__n">'+x.d+'</span>'+
        '<span class="bigrow__adds">'+x.c+' posts</span></div>'}).join('')+'</div>';
}

function vTheme(t){
  var rel = POSTS.filter(function(p){return p.th.indexOf(t)>-1});
  var meta = THEMES.filter(function(x){return x.t===t})[0]||{d:'',c:rel.length};
  return '<div class="viewhead"><h1 style="color:var(--accent)">#'+t+'</h1><p>'+(meta.d||'')+' · '+meta.c+' posts</p></div>'+
    '<div style="padding:14px 22px;border-bottom:1px solid var(--border)"><button class="btn" onclick="toast(\'Following #'+t+'\')">+ Follow theme</button></div>'+
    (rel.length?rel.map(postHTML).join(''):'<div class="empty">No posts loaded for this theme in the prototype.</div>');
}

/* ============================ RENDER ============================ */
function render(){
  var m=document.getElementById('main'), r=document.getElementById('rrail');
  if(view==='feed') m.innerHTML=vFeed();
  else if(view==='ticker') m.innerHTML=vTicker(ctx);
  else if(view==='research') m.innerHTML=vResearch();
  else if(view==='watchlists') m.innerHTML=vWatchlists();
  else if(view==='themes') m.innerHTML=vThemes();
  else if(view==='theme') m.innerHTML=vTheme(ctx);
  else if(view==='profile') m.innerHTML=vProfile(ctx);
  else if(view==='signup') m.innerHTML=vSignup();
  else if(view==='space') m.innerHTML=vSpace(ctx);

  var wc=document.getElementById('wcount');
  if(wc) wc.textContent = pubList().length+' public · '+(WATCH.length-pubList().length)+' private';
  r.innerHTML = (view==='signup') ? '' : railHTML();
  var sc=document.getElementById('scrim'); if(sc) sc.innerHTML=promoModal();
  var navView = (view==='ticker')?'research':(view==='theme'?'themes':((view==='profile'||view==='space')?'':view));
  [].forEach.call(document.querySelectorAll('.nav__sp'),function(b){
    b.classList.toggle('active', view==='space' && b.dataset.sp===ctx);
  });
  [].forEach.call(document.querySelectorAll('#nav button, #mobnav button'),function(b){
    b.classList.toggle('active', b.dataset.v===navView);
  });
}

function doPost(){
  if(!postReady()){toast('Needs a bit more before it posts');return;}
  POSTS.unshift({id:Date.now(),nm:'Eli Poteet',h:'elipoteet',sc:"UNH '27",beat:'Energy',t:'now',
    x:cText.trim(), tk:draftSym(), ty:cType, chg:cChange.trim()||null, r:0, pb:0,
    th:(cText.match(/#([a-z]+)/g)||[]).map(function(s){return s.slice(1)})});
  cText='';cChange='';cType='take';
  toast('Posted to the wire');
  render();
}

[].forEach.call(document.querySelectorAll('#nav button, #mobnav button'),function(b){
  b.onclick=function(){go(b.dataset.v)};
});

var gs=document.getElementById('gsearch'), gd=document.getElementById('gdrop');
gs.addEventListener('input',function(){
  var q=gs.value.toUpperCase().trim();
  if(!q){gd.style.display='none';return;}
  var hits=Object.keys(T).filter(function(s){return s.indexOf(q)>-1||T[s].n.toUpperCase().indexOf(q)>-1}).slice(0,7);
  gd.innerHTML = hits.length? hits.map(function(s){return '<div onclick="gs.value=\'\';gd.style.display=\'none\';go(\'ticker\',\''+s+'\')"><b>'+s+'</b><em>'+T[s].n+'</em></div>'}).join('') : '<div><em>No match</em></div>';
  gd.style.display='block';
});
gs.addEventListener('blur',function(){setTimeout(function(){gd.style.display='none'},180)});

render();
</script>
</body>
</html>
