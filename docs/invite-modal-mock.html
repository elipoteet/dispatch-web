<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Dispatch — Invite modal mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0E1D33; --cream:#F6F2E9; --gold:#B08430;
    --font:'Inter',system-ui,sans-serif; --mono:'IBM Plex Mono','SF Mono',monospace;
    --bg:var(--cream); --surface:#FFFDF7; --surface2:#EDE7DA;
    --border:rgba(14,29,51,.13); --border-strong:rgba(14,29,51,.28);
    --text:var(--navy); --dim:#5B6472; --accent:var(--gold);
    --green:#2F7D4F; --red:#A33A32;
    --r:10px; --rs:7px; --pill:999px;
    --btn-fg:var(--cream);
  }
  [data-theme="dark"]{
    --bg:#0B1727; --surface:#101F35; --surface2:#16283F;
    --border:rgba(246,242,233,.12); --border-strong:rgba(246,242,233,.26);
    --text:#F0EBE0; --dim:#93A0B2; --accent:#D2A44E; --green:#63B583; --red:#D97A70;
    --btn-fg:#0B1727;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .mono{font-family:var(--mono)}

  /* ---- mock chrome (not part of the product) ---- */
  .chrome{position:fixed;top:0;left:0;right:0;z-index:400;display:flex;gap:8px;align-items:center;
    padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
  .chrome span{font-family:var(--mono);font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);margin-right:6px}
  .chrome button{font-family:var(--mono);font-size:10px;letter-spacing:1.1px;text-transform:uppercase;
    border:1px solid var(--border);border-radius:var(--pill);padding:6px 13px;color:var(--dim)}
  .chrome button.on{background:var(--navy);color:var(--cream);border-color:var(--navy)}
  [data-theme="dark"] .chrome button.on{background:var(--accent);color:#0B1727;border-color:var(--accent)}

  /* ---- faint page behind the modal ---- */
  .behind{padding:88px 20px 40px;max-width:640px;margin:0 auto;filter:blur(1.5px);opacity:.55;user-select:none}
  .bcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
  .bline{height:9px;background:var(--surface2);border-radius:var(--pill);margin-bottom:9px}
  .brand{display:flex;align-items:center;gap:9px;margin-bottom:22px}
  .brand span{font-family:var(--mono);font-size:12px;letter-spacing:2.6px;text-transform:uppercase}

  /* ---- scrim + modal ---- */
  .scrim{position:fixed;inset:0;background:rgba(14,29,51,.55);backdrop-filter:blur(2px);
    z-index:200;display:flex;align-items:center;justify-content:center;padding:24px}
  .modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r);
    width:100%;max-width:440px;max-height:88vh;overflow:auto;
    animation:rise .22s cubic-bezier(.16,1,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.modal{animation:none}}

  .m__h{padding:22px 24px 0}
  .m__k{font-family:var(--mono);font-size:9.5px;letter-spacing:1.7px;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
  .inviter{display:flex;align-items:center;gap:11px;margin-bottom:18px}
  .av{width:38px;height:38px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;
    letter-spacing:.4px;color:var(--text);flex-shrink:0}
  .av--sch{box-shadow:inset 0 0 0 2px var(--school-accent,transparent)}
  .inviter__t{font-size:14.5px;line-height:1.45;min-width:0}
  .inviter__t b{font-weight:500}
  .badge{font-family:var(--mono);font-size:9.5px;letter-spacing:1.1px;color:var(--dim);display:block;margin-top:2px}
  .check{color:var(--green);font-size:10px}

  .m__space{border:1px solid var(--border);border-radius:var(--rs);background:var(--bg);padding:16px 17px}
  .m__space h2{font-size:19px;font-weight:500;letter-spacing:-.35px;line-height:1.25}
  .m__space p{font-size:13.5px;color:var(--dim);margin-top:7px;line-height:1.55}
  .meta{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
  .lock{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;
    letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);
    border:1px solid var(--border);border-radius:var(--pill);padding:4px 10px}
  .stack{display:flex;align-items:center}
  .stack .av{width:26px;height:26px;font-size:9px;margin-left:-7px;border:2px solid var(--bg)}
  .stack .av:first-child{margin-left:0}
  .memb{font-family:var(--mono);font-size:10px;letter-spacing:.9px;color:var(--dim)}

  .m__note{padding:16px 24px 0;font-size:13px;color:var(--dim);line-height:1.6}
  .m__note b{font-weight:500;color:var(--text)}
  .m__f{padding:20px 24px 22px;display:flex;gap:10px;align-items:center;justify-content:flex-end}
  .btn{font-family:var(--mono);font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;
    border:1px solid var(--border-strong);border-radius:var(--pill);padding:11px 20px;color:var(--text)}
  .btn:hover{background:var(--surface2)}
  .btn--p{background:var(--navy);color:var(--cream);border-color:var(--navy)}
  .btn--p:hover{background:#152845}
  [data-theme="dark"] .btn--p{background:var(--accent);color:#0B1727;border-color:var(--accent)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .fspace{flex:1}
  .fnote{font-family:var(--mono);font-size:9.5px;letter-spacing:1px;color:var(--dim);text-transform:uppercase}

  /* result states */
  .done{padding:30px 26px;text-align:left}
  .done__k{font-family:var(--mono);font-size:9.5px;letter-spacing:1.7px;text-transform:uppercase;
    color:var(--accent);margin-bottom:12px}
  .done h2{font-size:19px;font-weight:500;letter-spacing:-.35px}
  .done p{font-size:13.5px;color:var(--dim);margin-top:9px;line-height:1.6}
  .done .m__f{padding:22px 0 0}

  @media (max-width:520px){
    .scrim{padding:0;align-items:flex-end}
    .modal{max-width:none;border-radius:var(--r) var(--r) 0 0;border-bottom:none;max-height:92vh}
    .m__f{flex-wrap:wrap}
    .m__f .btn{flex:1;text-align:center}
  }
</style>
</head>
<body>

<div class="chrome">
  <span>Mock states</span>
  <button id="b1" class="on" onclick="setState('in')">Signed in</button>
  <button id="b2" onclick="setState('out')">Signed out</button>
  <button id="b3" onclick="setState('joined')">Joined</button>
  <button id="b4" onclick="setState('declined')">Declined</button>
  <button id="b5" onclick="setState('dead')">Link expired</button>
  <button onclick="toggleTheme()" style="margin-left:auto">Dark / light</button>
</div>

<div class="behind">
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="1" y="1" width="22" height="22" stroke="currentColor" stroke-width="1.4"/>
      <path d="M6 18V6h4a6 6 0 0 1 0 12H6z" stroke="currentColor" stroke-width="1.4"/>
      <path d="M4 17l7-7 3 3 6-6" stroke="#B08430" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <span>The Dispatch</span>
  </div>
  <div class="bcard"><div class="bline" style="width:42%"></div><div class="bline" style="width:88%"></div><div class="bline" style="width:74%"></div></div>
  <div class="bcard"><div class="bline" style="width:36%"></div><div class="bline" style="width:92%"></div><div class="bline" style="width:61%"></div></div>
  <div class="bcard"><div class="bline" style="width:48%"></div><div class="bline" style="width:80%"></div></div>
</div>

<div class="scrim" id="scrim"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script>
var LOCK = '<svg width="10" height="10" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="3" y="7" width="10" height="7" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" stroke="currentColor" stroke-width="1.4"/></svg>';

function inviteHTML(signedOut){
  return ''+
  '<div class="m__h">'+
    '<div class="m__k">Invitation</div>'+
    '<div class="inviter">'+
      '<div class="av av--sch" style="--school-accent:#003591">MC</div>'+
      '<div class="inviter__t">'+
        '<b>Maya Chen</b> invited you to a space'+
        '<span class="badge">UNH \'27 <span class="check">&#10003;</span></span>'+
      '</div>'+
    '</div>'+
    '<div class="m__space">'+
      '<h2>UNH Investment Club</h2>'+
      '<p>Where we work through pitches before they go to the room. Drafts, numbers, arguments.</p>'+
      '<div class="meta">'+
        '<span class="lock">'+LOCK+' Private</span>'+
        '<div class="stack">'+
          '<div class="av">MC</div><div class="av">JR</div><div class="av">TP</div><div class="av">AL</div>'+
        '</div>'+
        '<span class="memb">14 members</span>'+
      '</div>'+
    '</div>'+
  '</div>'+
  '<div class="m__note">'+
    (signedOut
      ? 'You will need a verified school email first. Confirm it and you land straight in this space &mdash; the invite is held for you.'
      : 'Posts here are visible to members only. Anything you write stays in the space unless you publish it to the feed yourself.')+
  '</div>'+
  '<div class="m__f">'+
    (signedOut ? '<span class="fnote fspace">Verify to join</span>' : '<span class="fspace"></span>')+
    '<button class="btn" onclick="setState(\'declined\')">Decline</button>'+
    '<button class="btn btn--p" onclick="setState(\''+(signedOut?'out2':'joined')+'\')">'+
      (signedOut ? 'Verify and join' : 'Join space')+'</button>'+
  '</div>';
}

function doneHTML(k,h,p,actions){
  return '<div class="done"><div class="done__k">'+k+'</div><h2>'+h+'</h2><p>'+p+'</p>'+
    '<div class="m__f">'+actions+'</div></div>';
}

var STATES = {
  'in':      function(){return inviteHTML(false)},
  'out':     function(){return inviteHTML(true)},
  'out2':    function(){return doneHTML('Check your email','Code sent to your school address',
              'Enter it on the next screen and you will land inside UNH Investment Club, not on a generic feed.',
              '<button class="btn btn--p" onclick="setState(\'joined\')">Continue</button>')},
  'joined':  function(){return doneHTML('Joined','You are in UNH Investment Club',
              'It now appears in your left navigation. Fourteen members, private, invite only.',
              '<button class="btn btn--p" onclick="setState(\'in\')">Open the space</button>')},
  'declined':function(){return doneHTML('Declined','You did not join',
              'Nobody in the space is told. The link keeps working &mdash; open it again any time and you can still join.',
              '<button class="btn" onclick="setState(\'in\')">Back to the feed</button>')},
  'dead':    function(){return doneHTML('Invitation','This link is no longer valid',
              'The owner regenerated it, which retires the old one immediately. Ask them for a fresh link.',
              '<button class="btn" onclick="setState(\'in\')">Back to the feed</button>')}
};

var BTN = {'in':'b1','out':'b2','joined':'b3','declined':'b4','dead':'b5'};

function setState(s){
  document.getElementById('modal').innerHTML = STATES[s]();
  ['b1','b2','b3','b4','b5'].forEach(function(id){document.getElementById(id).className=''});
  if(BTN[s]) document.getElementById(BTN[s]).className='on';
}

function toggleTheme(){
  var d = document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme', d?'light':'dark');
}
if(window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches){
  document.documentElement.setAttribute('data-theme','dark');
}else{
  document.documentElement.setAttribute('data-theme','light');
}
setState('in');
</script>
</body>
</html>
