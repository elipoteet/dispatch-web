<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../_shared/slide.css" />
</head>
<body>
  <div class="slide">
    
  <div class="masthead">
    <div class="brand">The Dispatch<span class="dot">·</span>Technicals</div>
    <div class="page">03 / 06</div>
  </div>
    
      <div class="body-copy">
        <div class="kicker">Two speeds</div>
        <h2 class="headline">50-day vs. 200-day</h2>
        <p class="support">One tracks the recent trend. The other tracks the long one — same price data, two different windows.</p>
        <div class="diagram">
          <div class="trend-chart">
<svg viewBox="0 0 900 260" preserveAspectRatio="none">
  <polyline points="0,220 120,205 240,190 360,180 480,150 600,110 720,80 840,40 900,20"
    fill="none" stroke="#0d1b2a" stroke-width="4" />
  <polyline points="0,235 120,225 240,210 360,195 480,175 600,150 720,120 840,95 900,80"
    fill="none" stroke="#a67c00" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" />
  <polyline points="0,245 120,240 240,232 360,222 480,208 600,192 720,175 840,158 900,148"
    fill="none" stroke="#2a3a52" stroke-width="4" stroke-dasharray="14 10" />
  <circle cx="900" cy="20" r="7" fill="#0d1b2a" />
  <circle cx="900" cy="80" r="7" fill="#a67c00" />
  <circle cx="900" cy="148" r="7" fill="#2a3a52" />
</svg></div>
          <div class="trend-legend">
            <div class="item"><span class="swatch" style="background:#0d1b2a"></span>PRICE</div><div class="item"><span class="swatch" style="background:#a67c00"></span>50-DAY</div><div class="item"><span class="swatch" style="background:#2a3a52"></span>200-DAY</div>
          </div>
        </div>
      </div>
  </div>
</body>
</html>
