<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../_shared/slide.css" />
</head>
<body>
  <div class="slide">
    
  <div class="masthead">
    <div class="brand">The Dispatch<span class="dot">·</span>Scoring</div>
    <div class="page">04 / 06</div>
  </div>
    
      <div class="body-copy">
        <div class="kicker">Same ticker, different answers</div>
        <h2 class="headline">They can disagree — and that's useful.</h2>
        <div class="split">
          <div class="split-col">
            <div class="col-title">Fundamentals</div>
            <div class="col-score">8<span style="font-size:28px;color:var(--navy-soft)">/10</span></div>
            <ul><li>healthy revenue growth</li><li>solid margins</li></ul>
          </div>
          <div class="vs-divider">VS</div>
          <div class="split-col">
            <div class="col-title">Technicals</div>
            <div class="col-score">3<span style="font-size:28px;color:var(--navy-soft)">/10</span></div>
            <ul><li>textbook downtrend</li><li>poor 90-day momentum</li></ul>
          </div>
        </div>
      </div>
  </div>
</body>
</html>
