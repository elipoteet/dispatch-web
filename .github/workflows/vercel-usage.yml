# Warns before Vercel pauses the account (scripts/vercel-usage-check.mjs).
# Once a day it reads Active CPU against the Hobby plan's 4 hours; at 70% it
# opens a GitHub issue here, and GitHub emails the repository's owner. It
# comments on that issue at 85% and 100%.
#
# Needs one repository secret, VERCEL_TOKEN: a Vercel access token for the
# account (vercel.com/account/tokens). Run it once by hand from the Actions
# tab ("Run workflow") after adding the secret, to see it read the usage.
#
# GitHub turns scheduled workflows off after 60 days without a commit to a
# public repository; it emails before it does.
name: Vercel usage check

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read Active CPU and warn at 70%
        run: node scripts/vercel-usage-check.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TELEMETRY_DISABLED: "1"
